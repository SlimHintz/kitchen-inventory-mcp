[project]
name = "kitchen-inventory-mcp"
version = "0.1.0"
description = "MCP server for household pantry/fridge/freezer inventory, meal planning, and depletion tracking"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "rapidfuzz>=3.6.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchen_inventory_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# DTZ011: flags bare date.today(); we use it deliberately for plain Date
# columns (expiration_date) which have no timezone concept at all.
ignore = ["DTZ011"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
